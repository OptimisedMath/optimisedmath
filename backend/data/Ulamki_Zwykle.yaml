chapter: "Ułamki Zwykłe"
id: 10
keyboard_type: "default"
topics:
  - id: 10
    name: "Zapisywanie"
    levels:
      - level: 1
        name: "Dzielenie jako ułamek"
        function: "frac_write_1"
        traps:
          copies_the_divisor_off_by_one:
            misconception: misreads_the_fraction_bar_as_division
            explanation: "Mianownik jest o jeden obok — przepisz dzielnik dokładnie tak, jak stoi w działaniu."
          sums_operands_into_the_denominator:
            misconception: misreads_the_fraction_bar_as_division
            explanation: "Zsumowałeś liczby w mianowniku! Kreska ułamkowa to inny zapis dzielenia, nie dodawania."
          swaps_dividend_and_divisor:
            misconception: misreads_the_fraction_bar_as_division
            explanation: "Odwróciłeś liczby! Pierwsza liczba (dzielna) wędruje na górę do licznika, a druga (dzielnik) na dół do mianownika."
  - id: 20
    name: "Rozszerzanie i skracanie"
    levels:
      - level: 1
        name: "Rozszerzanie przez liczbę"
        function: "frac_exp_1"
        traps:
          adds_the_factor_instead_of_multiplying:
            misconception: adds_or_subtracts_instead_of_scaling
            explanation: "Dodałeś liczbę zamiast pomnożyć! Rozszerzanie to zawsze mnożenie."
          scales_only_the_denominator:
            misconception: expands_only_one_part
            explanation: "Pomnożyłeś tylko mianownik! Przy rozszerzaniu mnożysz przez tę samą liczbę i górę, i dół."
          scales_only_the_numerator:
            misconception: expands_only_one_part
            explanation: "Pomnożyłeś tylko licznik! Przy rozszerzaniu mnożysz przez tę samą liczbę i górę, i dół."
      - level: 2
        name: "Rozszerzanie do mianownika"
        function: "frac_exp_2"
        traps:
          changes_the_denominator_leaving_the_numerator:
            misconception: expands_to_target_denominator_without_finding_factor
            explanation: "Zapomniałeś pomnożyć licznik! Kiedy zmieniasz dół ułamka, musisz proporcjonalnie zmienić też górę."
          copies_the_numerator_off_by_one:
            misconception: expands_to_target_denominator_without_finding_factor
            explanation: "Licznik jest o jeden obok. Policz mnożnik jeszcze raz: nowy mianownik podzielony przez stary."
          scales_the_numerator_by_the_wrong_factor:
            misconception: expands_to_target_denominator_without_finding_factor
            explanation: "Pomnożyłeś licznik przez złą liczbę. Sprawdź, ile razy zwiększył się mianownik, i pomnóż górę przez to samo."
      - level: 3
        name: "Skracanie przez liczbę"
        function: "frac_exp_3"
        traps:
          divides_only_the_denominator:
            misconception: reduces_only_one_part
            explanation: "Podzieliłeś tylko mianownik! Przy skracaniu dzielisz przez tę samą liczbę i górę, i dół."
          divides_only_the_numerator:
            misconception: reduces_only_one_part
            explanation: "Podzieliłeś tylko licznik! Przy skracaniu dzielisz przez tę samą liczbę i górę, i dół."
          subtracts_the_factor_instead_of_dividing:
            misconception: adds_or_subtracts_instead_of_scaling
            explanation: "Odjąłeś liczbę zamiast podzielić! Skracanie to zawsze dzielenie."
      - level: 4
        name: "Postać nieskracalna"
        function: "frac_exp_4"
        traps:
          reduces_the_denominator_further_than_the_numerator:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Skróciłeś dół bardziej niż górę! Obie liczby dziel przez tę samą wartość."
          reduces_the_numerator_further_than_the_denominator:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Skróciłeś górę bardziej niż dół! Obie liczby dziel przez tę samą wartość."
          stops_before_lowest_terms:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Twój ułamek jest skrócony, ale można go skrócić jeszcze bardziej. Szukaj wspólnych dzielników aż do skutku!"
  - id: 30
    name: "Liczby mieszane"
    levels:
      - level: 1
        name: "Zamiana na ułamek niewłaściwy"
        function: "frac_imp_1"
        traps:
          adds_the_whole_without_multiplying_by_the_denominator:
            misconception: mixed_to_improper_miscombines_parts
            explanation: "Dodałeś wszystkie liczby do siebie! Całości najpierw mnożymy przez mianownik, a dopiero potem dodajemy licznik."
          also_multiplies_the_denominator_by_the_whole:
            misconception: mixed_to_improper_miscombines_parts
            explanation: "Zmieniłeś mianownik! Przy zamianie mianownik zawsze zostaje ten sam."
          multiplies_the_numerator_instead_of_adding:
            misconception: mixed_to_improper_miscombines_parts
            explanation: "Pomnożyłeś licznik zamiast go dodać! Złota zasada: dół razy bok, PLUS góra."
      - level: 2
        name: "Wyłączanie całości"
        function: "frac_imp_2"
        traps:
          gives_only_the_whole_part:
            misconception: improper_to_mixed_mishandles_remainder
            explanation: "Gdzie podział się ułamek? Całości wyciągnąłeś dobrze, ale zapomniałeś zapisać reszty."
          swaps_the_remainder_and_the_denominator:
            misconception: improper_to_mixed_mishandles_remainder
            explanation: "Odwróciłeś ułamek! Mianownik zostaje ten sam, a reszta ląduje w liczniku."
  - id: 40
    name: "Porównywanie"
    radio_only: true
    levels:
      - level: 1
        name: "Ten sam mianownik"
        function: "frac_comp_1"
        traps:
          reverses_the_sign_with_equal_denominators:
            misconception: compares_wrong_when_denominators_equal
            explanation: "Zły znak! Kiedy mianowniki są takie same, większy jest ten ułamek, który ma większy licznik."
      - level: 2
        name: "Ten sam licznik"
        function: "frac_comp_2"
        traps:
          assumes_the_bigger_denominator_is_the_bigger_fraction:
            misconception: assumes_bigger_denominator_means_bigger_fraction
            explanation: "Zły znak! Kiedy liczniki są takie same, większy jest ten ułamek, który ma mniejszy mianownik — kawałki są większe!"
      - level: 3
        name: "Różne ułamki"
        function: "frac_comp_3"
        traps:
          reads_equal_fractions_as_greater_than:
            misconception: compares_unlike_fractions_without_common_denominator
            explanation: "Te ułamki są równe! Skróć oba do najprostszej postaci — wyjdzie dokładnie ten sam ułamek."
          reads_equal_fractions_as_less_than:
            misconception: compares_unlike_fractions_without_common_denominator
            explanation: "Te ułamki są równe! Rozszerz je do wspólnego mianownika, a zobaczysz tę samą liczbę."
  - id: 50
    name: "Oś liczbowa"
    levels:
      - level: 1
        name: "Jeden skok = 1/x"
        function: "frac_number_line_1"
        traps:
          counts_gaps_from_the_far_end:
            misconception: counts_from_the_axis_edge_not_the_label
            explanation: "Liczyłeś przerwy od prawego końca osi. Zacznij od zera i idź w prawo."
          counts_ticks_for_both_parts:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Policzyłeś kreski i w liczniku, i w mianowniku. Licz przerwy — kreska na zerze się nie liczy."
          counts_ticks_for_the_denominator:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Policzyłeś kreski zamiast przerw. Mianownik to liczba przerw między 0 a 1."
      - level: 2
        name: "Jeden skok to wielokrotność"
        function: "frac_number_line_2"
        traps:
          counts_gaps_from_the_far_end:
            misconception: counts_from_the_axis_edge_not_the_label
            explanation: "Liczyłeś przerwy od prawego końca osi zamiast od zera."
          counts_ticks_for_both_parts:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Policzyłeś kreski zamiast przerw — dlatego mianownik wyszedł o jeden za duży."
          reads_the_wrong_whole_interval:
            misconception: counts_from_the_axis_edge_not_the_label
            explanation: "Wziąłeś złą całość. Sprawdź, między którymi podpisanymi liczbami leży punkt."
      - level: 3
        name: "Wskazywanie liczby mieszanej"
        function: "frac_number_line_3"
        traps:
          assumes_the_labels_are_one_apart:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Założyłeś, że podpisane kreski dzieli 1. Sprawdź to — odstęp może być inny."
          off_by_one_gap:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Jesteś o jedną przerwę obok. Policz skoki jeszcze raz."
          reads_the_wrong_whole_interval:
            misconception: counts_from_the_axis_edge_not_the_label
            explanation: "Wziąłeś złą liczbę całości. Spójrz, między którymi pełnymi liczbami stoi punkt."
      - level: 4
        name: "Trudne przedziały"
        function: "frac_number_line_4"
        traps:
          counts_from_the_axis_edge_not_the_label:
            misconception: counts_from_the_axis_edge_not_the_label
            explanation: "Liczysz od lewego końca osi. Zacznij od podpisanej kreski i od jej wartości."
          off_by_one_gap:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Pomyliłeś się o jedną przerwę między etykietami."
          uses_total_ticks_as_the_denominator:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Wziąłeś wszystkie kreski na osi jako mianownik. Mianownik to liczba przerw w jednym przedziale."
  - id: 60
    name: "Dodawanie"
    levels:
      - level: 1
        name: "Ten sam mianownik"
        function: "frac_add_1"
        traps:
          adds_the_denominators:
            misconception: adds_denominators_with_like_fractions
            explanation: "Dodałeś do siebie mianowniki! Przy dodawaniu ułamków mianownik zawsze przepisujemy bez zmian."
      - level: 2
        name: "Jeden mianownik jest wielokrotnością drugiego"
        function: "frac_add_2"
        traps:
          adds_numerators_without_expanding:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Dodałeś liczniki, choć mianowniki są różne. Najpierw sprowadź ułamki do wspólnego mianownika."
          adds_the_denominators:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Dodałeś mianowniki do siebie! Wspólnego mianownika nie znajdujemy przez dodawanie — rozszerz oba ułamki."
      - level: 3
        name: "Różne mianowniki - wstęp"
        function: "frac_add_3"
        traps:
          adds_the_denominators:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Dodałeś do siebie mianowniki! Wspólny mianownik znajdujemy przez rozszerzanie, nie przez dodawanie."
          multiplies_the_scaled_numerators_instead_of_adding:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Rozszerzyłeś dobrze, ale liczniki pomnożyłeś zamiast dodać."
          uses_the_product_denominator_without_scaling_numerators:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Wziąłeś iloczyn mianowników, ale liczników nie rozszerzyłeś. Każdy licznik mnożymy przez mianownik drugiego ułamka."
      - level: 4
        name: "Liczby mieszane z wyłączaniem"
        function: "frac_add_4"
        traps:
          adds_the_denominators:
            misconception: adds_denominators_with_like_fractions
            explanation: "Dodałeś do siebie mianowniki! Tutaj mianowniki są takie same — przepisujemy je bez zmian i dodajemy tylko liczniki."
      - level: 5
        name: "Różne mianowniki - zaawansowane"
        function: "frac_add_5"
        traps:
          adds_the_denominators:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Dodałeś mianowniki do siebie zamiast znaleźć wspólny mianownik."
          uses_the_product_denominator_without_scaling_numerators:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Wspólny mianownik masz dobry, ale liczników nie rozszerzyłeś proporcjonalnie."
  - id: 70
    name: "Odejmowanie"
    levels:
      - level: 1
        name: "Ten sam mianownik"
        function: "frac_sub_1"
        traps:
          adds_instead_of_subtracting:
            misconception: adds_instead_of_subtracting
            explanation: "Zamiast odjąć, dodałeś liczniki — sprawdź znak działania."
      - level: 2
        name: "Różne mianowniki - wstęp"
        function: "frac_sub_2"
        traps:
          subtracts_numerators_without_expanding:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Odjąłeś liczniki mimo różnych mianowników. Najpierw wspólny mianownik."
          subtracts_the_denominators:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Odjąłeś mianowniki od siebie! Mianowników się nie odejmuje — sprowadź oba ułamki do wspólnego mianownika."
      - level: 3
        name: "Różne mianowniki - zaawansowane"
        function: "frac_sub_3"
        traps:
          adds_instead_of_subtracting:
            misconception: adds_instead_of_subtracting
            explanation: "Zamiast odjąć, dodałeś liczniki — sprawdź znak działania."
          subtracts_the_denominators:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Odjąłeś mianowniki! Mianowników się nie odejmuje — najpierw wspólny mianownik."
          uses_the_product_denominator_without_scaling_numerators:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Wziąłeś iloczyn mianowników, ale liczników nie rozszerzyłeś."
      - level: 4
        name: "Zabieranie całości w liczbie mieszanej"
        function: "frac_sub_4"
        traps:
          drops_the_denominator_after_subtracting:
            misconception: borrows_incorrectly_in_mixed_subtraction
            explanation: "Zgubiłeś mianownik po odjęciu. Mianownik zostaje ten sam przez całe działanie."
          drops_the_whole_parts:
            misconception: drops_whole_part
            explanation: "Zgubiłeś całości! Odejmij też duże liczby stojące z przodu."
      - level: 5
        name: "Odejmowanie z pożyczaniem całości"
        function: "frac_sub_5"
        traps:
          borrows_ten_instead_of_the_denominator:
            misconception: borrows_incorrectly_in_mixed_subtraction
            explanation: "Pożyczyłeś 10 zamiast mianownika. Jedna całość to tyle części, ile wynosi mianownik."
          borrows_without_decrementing_the_whole:
            misconception: borrows_incorrectly_in_mixed_subtraction
            explanation: "Zapomniałeś, że pożyczyłeś! Liczbę całości trzeba zmniejszyć o 1."
          subtracts_the_fractions_in_reverse_to_avoid_borrowing:
            misconception: subtracts_without_borrowing_from_whole
            explanation: "Odjąłeś ułamki w odwrotnej kolejności, żeby uniknąć pożyczania. Nie wolno zamieniać kolejności — trzeba pożyczyć całość."
  - id: 80
    name: "Mnożenie przez liczbę"
    levels:
      - level: 1
        name: "Mnożenie ułamka przez liczbę"
        function: "frac_mult_num_1"
        traps:
          multiplies_only_the_denominator:
            misconception: multiplies_fraction_by_whole_number_wrongly
            explanation: "Pomnożyłeś tylko mianownik! Liczba całkowita mnoży górę ułamka."
          multiplies_the_denominator_too:
            misconception: multiplies_fraction_by_whole_number_wrongly
            explanation: "Pomnożyłeś licznik ORAZ mianownik! Przy mnożeniu przez liczbę mnożymy tylko licznik."
      - level: 2
        name: "Skracanie na krzyż z liczbą"
        function: "frac_mult_num_2"
        traps:
          cancels_the_numerator_away:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Skracając, zgubiłeś licznik. Skracamy liczbę całkowitą z mianownikiem, licznik zostaje."
          stops_before_lowest_terms:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Wynik jest dobry, ale nieskrócony! Przed mnożeniem spróbuj skrócić liczbę całkowitą z mianownikiem."
      - level: 3
        name: "Mnożenie liczby mieszanej"
        function: "frac_mult_num_3"
        traps:
          multiplies_only_the_fraction_part:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Pomnożyłeś tylko ułamek, a całości zostawiłeś! Liczba z przodu mnoży całą liczbę mieszaną."
          multiplies_the_denominator_too:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Wciągnąłeś liczbę całkowitą na dół ułamka! Mianownik zostaje bez zmian."
  - id: 90
    name: "Mnożenie ułamków"
    levels:
      - level: 1
        name: "Proste mnożenie"
        function: "frac_mult_1"
        traps:
          adds_instead_of_multiplying:
            misconception: misapplies_fraction_multiplication_rule
            explanation: "Dodałeś zamiast pomnożyć!"
          keeps_the_first_denominator:
            misconception: misapplies_fraction_multiplication_rule
            explanation: "Zostawiłeś mianownik bez zmian! Tu nie szukamy wspólnego mianownika — mnożymy go."
          multiplies_crosswise:
            misconception: misapplies_fraction_multiplication_rule
            explanation: "Pomnożyłeś na krzyż! Zasada mnożenia ułamków to: góra z górą, dół z dołem."
      - level: 2
        name: "Skracanie na krzyż"
        function: "frac_mult_2"
        traps:
          cancels_the_numerators_away:
            misconception: cancels_horizontally
            explanation: "Skróciłeś poziomo! Skracać wolno tylko górę z dołem, nigdy dwóch liczników ze sobą."
          stops_before_lowest_terms:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Pominąłeś skracanie! Szukaj pary na krzyż do podzielenia przez tę samą liczbę."
      - level: 3
        name: "Mnożenie przez liczbę mieszaną"
        function: "frac_mult_3"
        traps:
          adds_instead_of_multiplying:
            misconception: misapplies_fraction_multiplication_rule
            explanation: "Dodałeś zamiast pomnożyć!"
          multiplies_without_converting_the_mixed_number:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Pomnożyłeś osobno całości i osobno ułamki! Najpierw zamień wszystko na ułamki niewłaściwe."
      - level: 4
        name: "Mnożenie liczb mieszanych"
        function: "frac_mult_4"
        traps:
          multiplies_fractions_and_adds_the_wholes:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Ułamki pomnożyłeś, ale całości dodałeś. Zamień liczby mieszane na niewłaściwe i pomnóż wszystko naraz."
          multiplies_wholes_and_fractions_separately:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Pomnożyłeś całości z całościami, a ułamki z ułamkami. Tak się nie da — zamień na ułamki niewłaściwe."
  - id: 100
    name: "Dzielenie przez liczbę"
    levels:
      - level: 1
        name: "Dzielenie licznika"
        function: "frac_div_num_1"
        traps:
          leaves_the_fraction_unchanged:
            misconception: divides_denominator_instead_of_numerator
            explanation: "Przepisałeś ułamek bez zmian. Dzielenie przez liczbę musi go zmniejszyć."
          multiplies_the_numerator_instead_of_dividing:
            misconception: divides_denominator_instead_of_multiplying_it
            explanation: "Pomnożyłeś licznik zamiast podzielić ułamek! Dzielenie przez liczbę powiększa mianownik."
      - level: 2
        name: "Gdy licznik się nie dzieli"
        function: "frac_div_num_2"
        traps:
          inverts_the_wrong_way_round:
            misconception: divides_fractions_without_inverting_the_second
            explanation: "Odwróciłeś pierwszy ułamek! Pierwszy zostaje bez zmian, odwracamy zawsze drugi."
          multiplies_without_inverting:
            misconception: divides_fractions_without_inverting_the_second
            explanation: "Pomnożyłeś bez odwracania! Dzielenie to mnożenie przez odwrotność drugiej liczby."
      - level: 3
        name: "Dzielenie liczby mieszanej"
        function: "frac_div_num_3"
        traps:
          divides_only_the_whole_part:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Podzieliłeś tylko całości, a ułamek zostawiłeś. Najpierw zamień na ułamek niewłaściwy."
          multiplies_the_numerator_instead_of_dividing:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Pomnożyłeś licznik zamiast podzielić. Zamień liczbę mieszaną na niewłaściwą i pomnóż przez odwrotność."
  - id: 110
    name: "Dzielenie ułamków"
    levels:
      - level: 1
        name: "Proste odwracanie"
        function: "frac_div_frac_1"
        traps:
          inverts_the_whole_answer:
            misconception: inverts_fraction_unnecessarily
            explanation: "Odwróciłeś cały wynik zamiast drugiego ułamka. Odwracamy przed mnożeniem, nie po."
          multiplies_without_inverting:
            misconception: divides_fractions_without_inverting_the_second
            explanation: "Zapomniałeś odwrócić! Dzielenie ułamków to mnożenie pierwszego przez odwrotność drugiego."
      - level: 2
        name: "Odwracanie i skracanie"
        function: "frac_div_frac_2"
        traps:
          cancels_before_inverting:
            misconception: cancels_before_inverting
            explanation: "Skróciłeś PRZED odwróceniem! Najpierw obróć drugi ułamek i zmień znak na mnożenie, dopiero potem skracaj."
          multiplies_without_inverting:
            misconception: divides_fractions_without_inverting_the_second
            explanation: "Pomnożyłeś bez odwracania drugiego ułamka."
      - level: 3
        name: "Dzielenie z liczbami mieszanymi"
        function: "frac_div_frac_3"
        traps:
          inverts_only_the_fraction_part:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Odwróciłeś tylko część ułamkową liczby mieszanej! Wciągnij całości do ułamka, zanim go odwrócisz."
          multiplies_without_inverting:
            misconception: divides_fractions_without_inverting_the_second
            explanation: "Najpierw zamień liczby mieszane na ułamki niewłaściwe, a potem obróć drugi ułamek i mnóż."
  - id: 120
    name: "Potęgowanie"
    levels:
      - level: 1
        name: "Kwadrat ułamka"
        function: "frac_pow_1"
        traps:
          multiplies_by_the_exponent:
            misconception: multiplies_by_exponent_instead_of_powering
            explanation: "Potęgowanie to mnożenie ułamka przez samego siebie, a nie mnożenie go przez 2!"
          raises_only_the_numerator:
            misconception: raises_only_one_part_to_power
            explanation: "Podniosłeś do kwadratu tylko górę! Potęgujesz i licznik, i mianownik."
      - level: 2
        name: "Sześcian ułamka"
        function: "frac_pow_2"
        traps:
          multiplies_by_the_exponent:
            misconception: multiplies_by_exponent_instead_of_powering
            explanation: "Pomnożyłeś przez 3! Sześcian to liczba pomnożona przez samą siebie trzy razy."
          raises_only_the_numerator:
            misconception: raises_only_one_part_to_power
            explanation: "Podniosłeś do trzeciej potęgi tylko górę! Licznik i mianownik potęgujemy osobno."
      - level: 3
        name: "Potęgowanie liczby mieszanej"
        function: "frac_pow_3"
        traps:
          raises_only_the_numerator:
            misconception: raises_only_one_part_to_power
            explanation: "Podniosłeś do potęgi tylko licznik. Mianownik też trzeba spotęgować."
          raises_the_parts_separately:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Podniosłeś do potęgi osobno całości i osobno ułamek! Najpierw wciągnij całości do ułamka niewłaściwego."
  - id: 130
    name: "Kolejność wykonywania działań"
    levels:
      - level: 1
        name: "Kolejność Podstawowa"
        function: "frac_ord_1"
        traps:
          adds_before_multiplying:
            misconception: ignores_the_order_of_operations
            explanation: "Dodałeś przed mnożeniem! Mnożenie i dzielenie wykonujemy przed dodawaniem."
          flattens_to_all_addition:
            explanation: "Dodałeś wszystkie liczby po kolei, ignorując pozostałe działania."
          flattens_to_all_multiplication:
            explanation: "Pomnożyłeś wszystkie liczby przez siebie, ignorując dodawanie."
          flattens_to_all_subtraction:
            explanation: "Odjąłeś wszystko po kolei od lewej do prawej, ignorując dzielenie."
          replaces_multiplication_with_addition:
            explanation: "Zamieniłeś mnożenie na dodawanie."
          subtracts_before_multiplying:
            misconception: ignores_the_order_of_operations
            explanation: "Odjąłeś przed mnożeniem! Mnożenie ma pierwszeństwo przed odejmowaniem."
      - level: 2
        name: "Siła Nawiasów"
        function: "frac_ord_2"
        traps:
          flattens_to_all_multiplication:
            explanation: "Pomnożyłeś wszystkie liczby przez siebie, ignorując dodawanie."
          flips_the_sign_inside_the_bracket:
            misconception: uses_wrong_sign_after_brackets
            explanation: "Pomyliłeś znak wewnątrz nawiasu."
          ignores_the_brackets:
            misconception: ignores_the_order_of_operations
            explanation: "Zignorowałeś nawias! Nawias zawsze idzie na pierwszy ogień."
          replaces_division_with_multiplication:
            explanation: "Zamieniłeś dzielenie na mnożenie."
          replaces_multiplication_with_addition:
            explanation: "Zamieniłeś mnożenie na dodawanie."
      - level: 3
        name: "Dwa Zestawy"
        function: "frac_ord_3"
        traps:
          ignores_the_brackets:
            misconception: ignores_the_order_of_operations
            explanation: "Zignorowałeś nawias! Nawias zawsze idzie na pierwszy ogień."
          ignores_the_second_bracket:
            misconception: ignores_the_order_of_operations
            explanation: "Rozwiązałeś pierwszy nawias, ale drugi zignorowałeś."
          invents_a_bracket_around_the_first_addition:
            misconception: ignores_the_order_of_operations
            explanation: "Wstawiłeś nawias, którego nie ma, wokół pierwszego dodawania."
          invents_brackets_around_both_additions:
            misconception: ignores_the_order_of_operations
            explanation: "Wstawiłeś nawiasy, których nie ma, wokół obu dodawań."
          replaces_addition_with_multiplication:
            explanation: "Zamieniłeś dodawanie na mnożenie."
          replaces_division_with_multiplication:
            explanation: "Zamieniłeś dzielenie na mnożenie."
      - level: 4
        name: "Potęgi i Ułamki"
        function: "frac_ord_4"
        traps:
          adds_before_multiplying:
            misconception: ignores_the_order_of_operations
            explanation: "Dodałeś przed mnożeniem! Mnożenie i dzielenie wykonujemy przed dodawaniem."
          ignores_the_exponent:
            explanation: "Pominąłeś potęgowanie i przepisałeś liczbę bez zmian."
          multiplies_by_the_exponent:
            misconception: multiplies_by_exponent_instead_of_powering
            explanation: "Pomnożyłeś przez 2 zamiast podnieść do kwadratu!"
          subtracts_before_squaring:
            misconception: ignores_the_order_of_operations
            explanation: "Odjąłeś przed potęgowaniem! Potęga wygrywa z odejmowaniem."
      - level: 5
        name: "Potęgowanie Nawiasu"
        function: "frac_ord_5"
        traps:
          flips_the_final_sign:
            misconception: uses_wrong_sign_after_brackets
            explanation: "Pomyliłeś znak na samym końcu działania."
          multiplies_before_squaring:
            misconception: ignores_the_order_of_operations
            explanation: "Pomnożyłeś przed potęgowaniem! Najpierw potęga, potem mnożenie."
          multiplies_by_the_exponent:
            misconception: multiplies_by_exponent_instead_of_powering
            explanation: "Pomnożyłeś przez 2 zamiast podnieść do kwadratu!"
          squares_the_bracket_terms_separately:
            misconception: distributes_power_over_bracket_terms
            explanation: "Podniosłeś do kwadratu obie liczby z nawiasu osobno! Najpierw policz nawias, potem potęguj."
      - level: 6
        name: "Boss Level"
        function: "frac_ord_6"
        traps:
          multiplies_before_squaring:
            misconception: ignores_the_order_of_operations
            explanation: "Pomnożyłeś przed potęgowaniem! Najpierw potęga, potem mnożenie."
          multiplies_by_the_exponent:
            misconception: multiplies_by_exponent_instead_of_powering
            explanation: "Pomnożyłeś przez 2 zamiast podnieść do kwadratu!"
          squares_the_bracket_terms_separately:
            misconception: distributes_power_over_bracket_terms
            explanation: "Podniosłeś do kwadratu obie liczby z nawiasu osobno! Najpierw policz nawias, potem potęguj."
  - id: 140
    name: "Ułamek z liczby"
    levels:
      - level: 1
        name: "Całości bez reszty"
        function: "frac_frac_of_int_1"
        traps:
          reads_it_as_a_mixed_number:
            misconception: does_not_read_fraction_of_as_multiplication
            explanation: "Potraktowałeś zapis jak liczbę mieszaną. Słowo 'z' oznacza mnożenie."
          swaps_the_numerator_and_denominator:
            misconception: does_not_read_fraction_of_as_multiplication
            explanation: "Odwróciłeś ułamek. 'Ułamek z liczby' to mnożenie przez ten ułamek, nie przez jego odwrotność."
      - level: 2
        name: "Gdy wynik jest ułamkiem"
        function: "frac_frac_of_int_2"
        traps:
          inverts_the_fraction_before_multiplying:
            misconception: does_not_read_fraction_of_as_multiplication
            explanation: "Odwróciłeś ułamek przed mnożeniem. Najszybciej: podziel liczbę przez mianownik, a wynik pomnóż przez licznik."
          multiplies_the_denominator_too:
            misconception: does_not_read_fraction_of_as_multiplication
            explanation: "Pomnożyłeś także mianownik. Liczba całkowita mnoży tylko licznik."
      - level: 3
        name: "Szukanie liczby z jej ułamka"
        function: "frac_frac_of_int_3"
        traps:
          applies_the_fraction_again_instead_of_inverting:
            misconception: does_not_read_fraction_of_as_multiplication
            explanation: "Zastosowałeś ułamek drugi raz zamiast dokończyć obliczenie."
          uses_one_more_than_the_denominator:
            misconception: does_not_read_fraction_of_as_multiplication
            explanation: "Wziąłeś mianownik o jeden za duży. Przepisz go dokładnie z ułamka."
      - level: 4
        name: "Powiększanie i pomniejszanie o ułamek"
        function: "frac_frac_of_int_4"
        traps:
          adds_only_the_numerator:
            explanation: "Dodałeś sam licznik. Najpierw policz ułamek z liczby, a dopiero tę część dodaj lub odejmij."
          gives_only_the_fraction_not_the_total:
            explanation: "Podałeś samą zmianę zamiast całej wartości. Policzoną część trzeba jeszcze dodać do liczby albo od niej odjąć."