chapter: "Ułamki Dziesiętne"
id: 20
keyboard_type: "decimal"
topics:
  - id: 10
    name: "Zamiana ułamków"
    levels:
      - level: 1
        name: "Z ułamka dziesiętnego na zwykły"
        function: "dec_to_frac_1"
        traps:
          inverts_into_a_unit_fraction:
            misconception: misreads_decimal_place_value_as_denominator
            explanation: "Zapisałeś ułamek jednostkowy. W liczniku ma stać to, co stoi po przecinku."
          shifts_the_denominator_by_one:
            misconception: misreads_decimal_place_value_as_denominator
            explanation: "Mianownik ma o jedno zero za dużo. Liczba zer to dokładnie liczba miejsc po przecinku."
          uses_one_fewer_place_for_the_denominator:
            misconception: misreads_decimal_place_value_as_denominator
            explanation: "Zły mianownik! Jedno miejsce po przecinku to 10, dwa to 100, trzy to 1000. Policz zera."
      - level: 2
        name: "Ze zwykłego na dziesiętny (mianowniki 10, 100)"
        function: "dec_to_frac_2"
        traps:
          shifts_the_point_one_place_too_far:
            misconception: misreads_denominator_zeros_as_decimal_places
            explanation: "Masz o jedno miejsce po przecinku za dużo. Policz zera na dole ułamka."
          writes_the_denominator_after_the_point:
            misconception: misreads_denominator_zeros_as_decimal_places
            explanation: "Wpisałeś po przecinku mianownik zamiast licznika."
          writes_the_digits_side_by_side:
            misconception: misreads_denominator_zeros_as_decimal_places
            explanation: "Skleiłeś cyfry obok siebie. Liczba zer w mianowniku mówi, ile miejsc ma zająć licznik po przecinku."
      - level: 3
        name: "Ze zwykłego na dziesiętny (rozszerzanie 2, 4, 5)"
        function: "dec_to_frac_3"
        traps:
          shifts_the_point_one_place_too_far:
            misconception: converts_to_decimal_without_expanding_to_power_of_ten
            explanation: "Masz o jedno miejsce po przecinku za dużo. Sprawdź, do jakiej potęgi dziesiątki rozszerzasz mianownik."
          writes_the_denominator_after_the_point:
            misconception: converts_to_decimal_without_expanding_to_power_of_ten
            explanation: "Po przecinku wpisałeś mianownik. Po rozszerzeniu to licznik ląduje po przecinku."
          writes_the_digits_side_by_side:
            misconception: converts_to_decimal_without_expanding_to_power_of_ten
            explanation: "Skleiłeś cyfry ułamka obok siebie. Najpierw rozszerz go tak, by na dole było 10, 100 lub 1000."
      - level: 4
        name: "Ze zwykłego na dziesiętny (dzielenie)"
        function: "dec_to_frac_4"
        traps:
          adds_a_leading_zero_before_the_period:
            misconception: omits_repeating_decimal_notation
            explanation: "Dodałeś zbędne zero przed okresem."
          gets_the_period_digit_wrong:
            misconception: omits_repeating_decimal_notation
            explanation: "Zła cyfra w okresie — sprawdź wynik dzielenia licznika przez mianownik."
          omits_the_period_brackets:
            misconception: omits_repeating_decimal_notation
            explanation: "Zapomniałeś nawiasu okresu! Rozwinięcie nieskończone zapisujemy np. 0,(3)."
  - id: 20
    name: "Porównywanie"
    radio_only: true
    levels:
      - level: 1
        name: "Różne cyfry, te same pozycje"
        function: "dec_compare_1"
        traps:
          compares_by_the_lower_place_digit:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Porównałeś dalsze cyfry. Zacznij od pierwszej cyfry po przecinku."
          reads_unequal_decimals_as_equal:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Liczby nie są równe — nie wybieraj znaku równości!"
      - level: 2
        name: "Różna liczba miejsc po przecinku"
        function: "dec_compare_2"
        traps:
          compares_by_the_number_of_decimal_places:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Dłuższa liczba nie znaczy większa! Porównuj cyfry rzędami od lewej."
          reads_trailing_zero_as_larger:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Zero na końcu nic nie zmienia — 0,50 to tyle samo co 0,5."
          reads_trailing_zero_as_smaller:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Zero na końcu nic nie zmienia — 0,5 to tyle samo co 0,50."
          reads_unequal_decimals_as_equal:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Liczby nie są równe — nie wybieraj znaku równości!"
      - level: 3
        name: "Zdradliwe zera"
        function: "dec_compare_3"
        traps:
          ignores_the_zero_straight_after_the_point:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Pominąłeś zero zaraz po przecinku, a ono dziesięciokrotnie zmniejsza liczbę."
          reads_trailing_zero_as_larger:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Zero na końcu nic nie zmienia — 0,50 to tyle samo co 0,5."
          reads_trailing_zero_as_smaller:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Zero na końcu nic nie zmienia — 0,5 to tyle samo co 0,50."
          reads_unequal_decimals_as_equal:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Liczby nie są równe — nie wybieraj znaku równości!"
      - level: 4
        name: "Rozwinięcie nieskończone"
        function: "dec_compare_4"
        traps:
          compares_a_period_to_a_finite_decimal_by_first_digits:
            misconception: compares_repeating_decimals_incorrectly
            explanation: "Porównałeś tylko pierwsze cyfry. Rozpisz okres na kilka miejsc i dopiero porównuj."
          compares_two_periods_by_first_digits:
            misconception: compares_repeating_decimals_incorrectly
            explanation: "Porównałeś tylko pierwsze cyfry obu okresów. Rozpisz je dalej."
          reads_different_periods_as_equal:
            misconception: compares_repeating_decimals_incorrectly
            explanation: "Okresy są różne, więc liczby nie są równe."
          reads_the_period_as_its_short_form:
            misconception: compares_repeating_decimals_incorrectly
            explanation: "Potraktowałeś 0,(3) jak 0,3. Okres powtarza się bez końca."
          reads_unequal_decimals_as_equal:
            misconception: compares_repeating_decimals_incorrectly
            explanation: "Liczby nie są równe — nie wybieraj znaku równości!"
          treats_the_period_as_a_single_digit:
            misconception: compares_repeating_decimals_incorrectly
            explanation: "Potraktowałeś okres jak jedną cyfrę. On powtarza się w nieskończoność."
  - id: 30
    name: "Oś liczbowa"
    levels:
      - level: 1
        name: "Oś co 0.1"
        function: "dec_number_line_1"
        traps:
          assumes_a_hundredth_step:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Założyłeś, że jeden skok to setna. Policz przerwy w przedziale — tutaj skok to dziesiąta."
          counts_gaps_from_the_far_end:
            misconception: counts_from_the_axis_edge_not_the_label
            explanation: "Liczyłeś przerwy od prawego końca osi. Zacznij od zera."
          off_by_one_gap:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Jesteś o jedną przerwę obok — policz przerwy od zera, nie kreski."
      - level: 2
        name: "Oś co 0.01"
        function: "dec_number_line_2"
        traps:
          assumes_a_ten_times_smaller_step:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Twój skok jest dziesięć razy za mały. Policz przerwy w przedziale i podziel przez nie jego szerokość."
          counts_gaps_from_the_far_end:
            misconception: counts_from_the_axis_edge_not_the_label
            explanation: "Liczyłeś przerwy od prawej strony przedziału zamiast od lewej."
          off_by_one_gap:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Wielkość skoku masz dobrą — pomyliłeś się o jedną przerwę."
      - level: 3
        name: "Oś co 0.2 lub podobne"
        function: "dec_number_line_3"
        traps:
          assumes_a_tenth_step:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Założyłeś, że jeden skok to dziesiąta. Sprawdź, ile przerw dzieli pełną jedność."
          counts_gaps_from_the_far_end:
            misconception: counts_from_the_axis_edge_not_the_label
            explanation: "Liczyłeś przerwy od prawej strony przedziału zamiast od lewej."
          off_by_one_gap:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Wielkość skoku masz dobrą — pomyliłeś się o jedną przerwę."
      - level: 4
        name: "Duży odstęp"
        function: "dec_number_line_4"
        traps:
          assumes_a_hundredth_step:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Założyłeś wielkość skoku. Oblicz szerokość przedziału i podziel ją przez liczbę przerw."
          counts_gaps_from_the_far_end:
            misconception: counts_from_the_axis_edge_not_the_label
            explanation: "Liczyłeś od prawej etykiety zamiast od lewej."
          off_by_one_gap:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Błąd w liczeniu skoków — o jedną przerwę za mało lub za dużo."
      - level: 5
        name: "Duży odstęp cz. 2"
        function: "dec_number_line_5"
        traps:
          doubles_the_step_past_the_last_label:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Za ostatnią etykietą wziąłeś dwa razy większy skok. Skok jest na całej osi taki sam."
          doubles_the_whole_distance:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Podwoiłeś całą odległość. Najpierw policz przerwy, potem odejmij skrajne wartości, na końcu podziel."
          off_by_one_gap:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Skok policzyłeś dobrze, ale jesteś o jedną przerwę za daleko."
      - level: 6
        name: "Dziwne przedziały"
        function: "dec_number_line_6"
        traps:
          assumes_a_tenth_step:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Zgadłeś, że skok to dziesiąta, zamiast go obliczyć."
          off_by_one_gap:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Jesteś o jeden skok w prawo — policz przerwy jeszcze raz, nie kreski."
          off_by_one_gap_backwards:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Jesteś o jeden skok w lewo — policz przerwy jeszcze raz, nie kreski."
  - id: 40
    name: "Zaokrąglanie"
    levels:
      - level: 1
        name: "Do całości"
        function: "dec_round_1"
        traps:
          leaves_the_number_unrounded:
            misconception: rounds_using_the_wrong_digit
            explanation: "Nie zaokrągliłeś wcale. Zostaw samą całość, bez części po przecinku."
          rounds_the_wrong_way:
            misconception: rounds_using_the_wrong_digit
            explanation: "Zapomniałeś o regule '5 i więcej'! Jeśli cyfra po przecinku to 5, 6, 7, 8 lub 9, całość rośnie o jeden."
      - level: 2
        name: "Do części dziesiątych"
        function: "dec_round_2"
        traps:
          rounds_the_wrong_way:
            misconception: rounds_using_the_wrong_digit
            explanation: "Zaokrągliłeś w złą stronę. O kierunku decyduje druga cyfra po przecinku."
          rounds_to_the_wrong_place:
            misconception: rounds_using_the_wrong_digit
            explanation: "Zaokrągliłeś do złego rzędu. Zostaw dokładnie jedno miejsce po przecinku."
      - level: 3
        name: "Zdradliwa dziewiątka"
        function: "dec_round_3"
        traps:
          drops_the_trailing_zero_after_carrying:
            misconception: rounds_nine_without_carrying
            explanation: "Po przeniesieniu zgubiłeś zero na końcu."
          truncates_instead_of_carrying:
            misconception: rounds_nine_without_carrying
            explanation: "Zostawiłeś ,9 zamiast przejść do następnej całości."
          writes_ten_in_the_tenths_place:
            misconception: rounds_nine_without_carrying
            explanation: "Wpisałeś 10 w miejscu dziesiątych. Gdy 9 rośnie, przenosisz jeden do wyższego rzędu."
  - id: 50
    name: "Dodawanie"
    levels:
      - level: 1
        name: "Bez przekroczenia rzędu"
        function: "dec_add_1"
        traps:
          adds_digits_across_the_point:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Źle podstawiłeś przecinek! Złota zasada dodawania to: przecinek pod przecinkiem."
      - level: 2
        name: "Z przekroczeniem rzędu"
        function: "dec_add_2"
        traps:
          applies_the_multiplication_point_rule:
            misconception: applies_multiplication_decimal_rule_to_addition
            explanation: "Zastosowałeś zasadę z mnożenia! Przy dodawaniu przecinek opada w dół, nie sumujemy miejsc po przecinku."
          concatenates_the_two_sums:
            misconception: forgets_to_carry
            explanation: "Zamiast przenieść '1', dopisałeś cały wynik po przecinku."
          forgets_the_carry:
            misconception: forgets_to_carry
            explanation: "Zapomniałeś przenieść '1' do wyższego rzędu!"
      - level: 3
        name: "Różna liczba miejsc (np. 1.2 + 0.05)"
        function: "dec_add_3"
        traps:
          aligns_the_last_digits_instead_of_the_point:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Wyrównałeś liczby do prawej. Dopisz '0' na końcu krótszej (1,2 na 1,20) i wyrównaj przecinki."
          drops_the_hundredths_digit:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Zgubiłeś cyfrę setnych. Dodawaj wszystkie rzędy, także te, których w krótszej liczbie nie widać."
          shifts_the_point_when_adding:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Przecinek jest ułożony źle. W działaniach pisemnych przecinek musi stać nad przecinkiem."
  - id: 60
    name: "Odejmowanie"
    levels:
      - level: 1
        name: "Bez pożyczania"
        function: "dec_sub_1"
        traps:
          subtracts_the_smaller_digit_in_each_column:
            misconception: forgets_to_borrow
            explanation: "W każdej kolumnie odjąłeś mniejszą cyfrę od większej. Odejmuj z góry na dół i pożycz, gdy trzeba."
      - level: 2
        name: "Z pożyczaniem"
        function: "dec_sub_2"
        traps:
          borrows_but_leaves_nine_in_the_hundredths:
            misconception: forgets_to_borrow
            explanation: "Pożyczyłeś, ale zostawiłeś 9 w setnych. Sprawdź ten rząd jeszcze raz."
          misaligns_the_second_number_by_one_place:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Przesunąłeś drugą liczbę o jedno miejsce. Przecinek opada równo na dół."
      - level: 3
        name: "Z dopisywaniem zer (np. 1 - 0.25)"
        function: "dec_sub_3"
        traps:
          borrows_over_zero_incorrectly:
            misconception: borrows_across_zero_incorrectly
            explanation: "Gdy pożyczasz nad zerem, to zero staje się 9."
          mishandles_the_hundredths_when_borrowing:
            misconception: forgets_to_borrow
            explanation: "Błąd w rzędzie setnych przy pożyczaniu. Dopisz zera na górze (1 na 1,00) i pożyczaj po kolei."
          off_by_one_tenth_when_borrowing:
            misconception: forgets_to_borrow
            explanation: "Pomyliłeś się o jedną dziesiątą przy pożyczaniu."
  - id: 70
    name: "Przesuwanie przecinka"
    levels:
      - level: 1
        name: "Mnożenie przez 10, 100..."
        function: "dec_comma_1"
        traps:
          appends_zeros_without_moving_the_point:
            misconception: shifts_decimal_point_incorrectly
            explanation: "Dopisałeś zera, ale przecinka nie ruszyłeś."
          shifts_by_the_wrong_number_of_places:
            misconception: shifts_decimal_point_incorrectly
            explanation: "Przesunąłeś o złą liczbę miejsc. Mnożąc przez 100 masz dwa zera, więc dwa skoki."
          shifts_the_point_the_wrong_way:
            misconception: shifts_decimal_point_incorrectly
            explanation: "Przesunąłeś przecinek w lewo! Mnożenie powiększa liczbę, więc przecinek maszeruje w PRAWO."
      - level: 2
        name: "Dzielenie przez 10, 100..."
        function: "dec_comma_2"
        traps:
          shifts_by_the_wrong_number_of_places:
            misconception: shifts_decimal_point_incorrectly
            explanation: "Przesunąłeś o złą liczbę miejsc. Dzieląc przez 100 robisz dwa skoki w lewo."
          shifts_one_place_too_far:
            misconception: shifts_decimal_point_incorrectly
            explanation: "Przesunąłeś o jedno miejsce za daleko."
          shifts_the_point_the_wrong_way:
            misconception: shifts_decimal_point_incorrectly
            explanation: "Przesunąłeś przecinek w prawo! Dzielenie zmniejsza liczbę, więc przecinek ucieka w LEWO."
  - id: 80
    name: "Mnożenie"
    levels:
      - level: 1
        name: "Przez liczbę jednocyfrową"
        function: "dec_mult_1"
        traps:
          ignores_the_point_in_the_factor:
            misconception: misplaces_decimal_point_in_product
            explanation: "Pominąłeś przecinek w mnożonej liczbie."
          puts_two_places_too_many_in_the_product:
            misconception: misplaces_decimal_point_in_product
            explanation: "Za dużo miejsc po przecinku. Wynik ma ich tyle, ile jest łącznie w mnożonych liczbach."
      - level: 2
        name: "Ułamek przez ułamek"
        function: "dec_mult_2"
        traps:
          ignores_both_points_in_the_factors:
            misconception: misplaces_decimal_point_in_product
            explanation: "Pominąłeś przecinki w obu liczbach. Policz je i tyle miejsc zostaw po przecinku w wyniku."
          puts_one_place_too_few_in_the_product:
            misconception: misplaces_decimal_point_in_product
            explanation: "Za mało miejsc po przecinku w wyniku."
          puts_one_place_too_many_in_the_product:
            misconception: misplaces_decimal_point_in_product
            explanation: "Za dużo miejsc po przecinku w wyniku."
      - level: 3
        name: "Z dużą ilością zer"
        function: "dec_mult_3"
        traps:
          puts_one_place_too_few_in_the_product:
            misconception: misplaces_decimal_point_in_product
            explanation: "Za mało miejsc po przecinku — pamiętaj, że zera z przodu też się liczą."
          puts_one_place_too_many_in_the_product:
            misconception: misplaces_decimal_point_in_product
            explanation: "Za dużo miejsc po przecinku — policz je w obu mnożonych liczbach."
  - id: 90
    name: "Dzielenie"
    levels:
      - level: 1
        name: "Przez liczbę całkowitą (bez reszty)"
        function: "dec_div_1"
        traps:
          ignores_the_point_in_the_dividend:
            misconception: misplaces_decimal_point_in_quotient
            explanation: "Zgubiłeś przecinek w dzielnej. Przecinek w wyniku stawiasz dokładnie nad przecinkiem dzielnej."
          puts_one_place_too_many_in_the_quotient:
            misconception: misplaces_decimal_point_in_quotient
            explanation: "Wynik ma o jedno miejsce po przecinku za dużo."
      - level: 2
        name: "Przez liczbę całkowitą (z resztą)"
        function: "dec_div_2"
        traps:
          puts_one_place_too_few_in_the_quotient:
            misconception: misplaces_decimal_point_in_quotient
            explanation: "Wynik ma o jedno miejsce po przecinku za mało."
          puts_one_place_too_many_in_the_quotient:
            misconception: misplaces_decimal_point_in_quotient
            explanation: "Wynik ma o jedno miejsce po przecinku za dużo."
          sums_the_decimal_places_as_in_multiplication:
            misconception: misplaces_decimal_point_in_quotient
            explanation: "Zsumowałeś miejsca po przecinku jak przy mnożeniu. Przy dzieleniu ta zasada nie działa."
      - level: 3
        name: "Przez ułamek dziesiętny (proste)"
        function: "dec_div_3"
        traps:
          shifts_only_the_dividend:
            misconception: divides_by_decimal_without_clearing_the_divisor
            explanation: "Przesunąłeś przecinek tylko w dzielnej. Przesuwaj go w OBU liczbach o tyle samo."
          shifts_the_dividend_two_places_the_wrong_way:
            misconception: divides_by_decimal_without_clearing_the_divisor
            explanation: "Przesunąłeś dzielną o dwa miejsca w złą stronę."
      - level: 4
        name: "Przez ułamek dziesiętny (zaawansowane)"
        function: "dec_div_4"
        traps:
          shifts_the_divisor_instead_of_appending_a_zero:
            misconception: stops_division_at_remainder
            explanation: "Zamiast dopisać zero na końcu dzielnej, ruszyłeś dzielnik. Dopisz '0' i dziel dalej."
