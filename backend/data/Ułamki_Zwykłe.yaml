chapter: "Ułamki Zwykłe"
id: 10
keyboard_type: "default"
topics:
  - id: 10
    name: "Zapisywanie"
    levels:
      - level: 1
        name: "Dzielenie jako ułamek"
        function: "frac_write_1"
        traps:
          t1:
            misconception: misreads_the_fraction_bar_as_division
            explanation: "Odwróciłeś liczby! Pierwsza liczba (dzielna) zawsze wędruje na górę do licznika, a druga (dzielnik) na dół do mianownika."
          t2:
            misconception: misreads_the_fraction_bar_as_division
            explanation: "Zsumowałeś liczby w mianowniku! Kreska ułamkowa to po prostu inny zapis znaku dzielenia, nie dodawania."

  - id: 20
    name: "Rozszerzanie i skracanie"
    levels:
      - level: 1
        name: "Rozszerzanie przez liczbę"
        function: "frac_exp_1"
        traps:
          t1:
            misconception: expands_only_one_part
            explanation: "Pomnożyłeś tylko licznik! Przy rozszerzaniu musisz pomnożyć przez tę samą liczbę zarówno górę, jak i dół."
          t2:
            misconception: expands_only_one_part
            explanation: "Pomnożyłeś tylko mianownik! Przy rozszerzaniu musisz pomnożyć przez tę samą liczbę zarówno górę, jak i dół."
          t3:
            misconception: adds_or_subtracts_instead_of_scaling
            explanation: "Dodałeś liczbę zamiast pomnożyć! Rozszerzanie to zawsze mnożenie."
      - level: 2
        name: "Rozszerzanie do mianownika"
        function: "frac_exp_2"
        traps:
          t1:
            misconception: expands_to_target_denominator_without_finding_factor
            explanation: "Zapomniałeś pomnożyć licznik! Kiedy zmieniasz dół ułamka, musisz proporcjonalnie zmienić też górę."
          t2:
            misconception: expands_to_target_denominator_without_finding_factor
            explanation: "Pomnożyłeś licznik przez złą liczbę. Sprawdź, ile razy zwiększył się mianownik i pomnóż górę przez to samo."
      - level: 3
        name: "Skracanie przez liczbę"
        function: "frac_exp_3"
        traps:
          t1:
            misconception: reduces_only_one_part
            explanation: "Podzieliłeś tylko licznik! Przy skracaniu musisz podzielić przez tę samą liczbę zarówno górę, jak i dół."
          t2:
            misconception: reduces_only_one_part
            explanation: "Podzieliłeś tylko mianownik! Przy skracaniu musisz podzielić przez tę samą liczbę zarówno górę, jak i dół."
          t3:
            misconception: adds_or_subtracts_instead_of_scaling
            explanation: "Odjąłeś liczbę zamiast podzielić! Skracanie to zawsze dzielenie."
      - level: 4
        name: "Postać nieskracalna"
        function: "frac_exp_4"
        traps:
          t1:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Twój ułamek jest skrócony, ale można go skrócić JESZCZE BARDZIEJ. Szukaj wspólnych dzielników aż do skutku!"
          t2:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Skróciłeś tylko dół! Pamiętaj o podzieleniu licznika."
          t3:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Skróciłeś tylko górę! Pamiętaj o podzieleniu mianownika."

  - id: 30
    name: "Liczby mieszane"
    levels:
      - level: 1
        name: "Zamiana na ułamek niewłaściwy"
        function: "frac_imp_1"
        traps:
          t1:
            misconception: mixed_to_improper_miscombines_parts
            explanation: "Pomnożyłeś licznik zamiast go dodać! Złota zasada: dół razy bok, PLUS góra."
          t2:
            misconception: mixed_to_improper_miscombines_parts
            explanation: "Dodałeś wszystkie liczby do siebie! Pamiętaj: mianownik mnożymy przez całości, a potem dodajemy licznik."
          t3:
            misconception: mixed_to_improper_miscombines_parts
            explanation: "Zmieniłeś mianownik! Mianownik przy zamianie zawsze pozostaje ten sam."
      - level: 2
        name: "Wyłączanie całości"
        function: "frac_imp_2"
        traps:
          t1:
            misconception: improper_to_mixed_mishandles_remainder
            explanation: "Gdzie podział się ułamek? Wyciągnąłeś całości poprawnie, ale zapomniałeś zapisać to, co zostało jako reszta."
          t2:
            misconception: improper_to_mixed_mishandles_remainder
            explanation: "Odwróciłeś ułamek! Mianownik zawsze zostaje ten sam, a reszta ląduje w liczniku."

  - id: 40
    name: "Porównywanie"
    radio_only: true
    levels:
      - level: 1
        name: "Ten sam mianownik"
        function: "frac_comp_1"
        traps:
          t1:
            misconception: compares_wrong_when_denominators_equal
            explanation: "Zły znak! Kiedy mianowniki są takie same, większy jest ten ułamek, który ma większy licznik."
      - level: 2
        name: "Ten sam licznik"
        function: "frac_comp_2"
        traps:
          t1:
            misconception: assumes_bigger_denominator_means_bigger_fraction
            explanation: "Zły znak! Kiedy liczniki są takie same, większy jest ten ułamek, który ma mniejszy mianownik (kawałki są większe!)."
      - level: 3
        name: "Różne ułamki"
        function: "frac_comp_3"
        traps:
          t1:
            misconception: compares_unlike_fractions_without_common_denominator
            explanation: "Zły znak! Aby porównać te ułamki bezpiecznie, rozszerz je najpierw do wspólnego mianownika."
          t2:
            misconception: compares_unlike_fractions_without_common_denominator
            explanation: "Liczby są równe — wybierz znak równości!"
          t3:
            misconception: compares_unlike_fractions_without_common_denominator
            explanation: "Gdy liczby są równe, nie wybieraj '<' ani '>'!"

  - id: 50
    name: "Oś liczbowa"
    levels:
      - level: 1
        name: "Jeden skok = 1/x"
        function: "frac_number_line_1"
        traps:
          t1:
            misconception: misreads_number_line_scale
            explanation: "Pomyłka! Zobacz na mianownik i policz wszystkie przerwy między 0 a 1. To jest twój 'skok'."
          t2:
            misconception: misreads_number_line_scale
            explanation: "Jesteś o jeden skok za daleko lub za blisko."
      - level: 2
        name: "Jeden skok to wielokrotność"
        function: "frac_number_line_2"
        traps:
          t1:
            misconception: misreads_number_line_scale
            explanation: "Ułamek skrócony niepoprawnie. Sprawdź, czy dobrze policzyłeś odległość!"
          t2:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Zapomniałeś skrócić ułamka na końcu."
      - level: 3
        name: "Wskazywanie liczby mieszanej"
        function: "frac_number_line_3"
        traps:
          t1:
            misconception: drops_whole_part
            explanation: "Zapomniałeś o całościach z przodu!"
          t2:
            misconception: misreads_number_line_scale
            explanation: "Źle policzyłeś 'skoki' między całościami."
      - level: 4
        name: "Trudne przedziały"
        function: "frac_number_line_4"
        traps:
          t1:
            misconception: misreads_number_line_scale
            explanation: "Pomyłka! Najpierw oblicz wartość jednego małego skoku."
          t2:
            misconception: misreads_number_line_scale
            explanation: "Błąd w liczeniu skoków między etykietami."

  - id: 60
    name: "Dodawanie"
    levels:
      - level: 1
        name: "Ten sam mianownik"
        function: "frac_add_1"
        traps:
          t1:
            misconception: adds_denominators_with_like_fractions
            explanation: "Dodałeś do siebie mianowniki! Przy dodawaniu ułamków mianownik ZAWSZE przepisujemy bez zmian."
      - level: 2
        name: "Skracanie wyniku"
        function: "frac_add_2"
        traps:
          t1:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Twój wynik jest dobry, ale NIE JEST skrócony! Zawsze podawaj ułamek w najprostszej postaci."
          t2:
            misconception: adds_denominators_with_like_fractions
            explanation: "Dodałeś mianowniki do siebie! Pamiętaj: mianownik przepisujemy, dodajemy tylko górę."
          t3:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Skróciłeś źle! Pamiętaj, żeby podzielić górę i dół przez tę samą liczbę."
      - level: 3
        name: "Liczby mieszane z wyłączaniem"
        function: "frac_add_3"
        traps:
          t1:
            misconception: leaves_improper_fraction_in_result
            explanation: "Zostawiłeś ułamek niewłaściwy! Jeśli licznik jest większy od mianownika, zamień go na kolejną całość."
          t2:
            misconception: drops_whole_part
            explanation: "Zapomniałeś dodać całości do siebie! Najpierw dodaj duże liczby z przodu, potem ułamki."
          t3:
            misconception: adds_denominators_with_like_fractions
            explanation: "Dodałeś do siebie mianowniki! Mianownik zawsze przepisujemy."
      - level: 4
        name: "Różne mianowniki - wstęp"
        function: "frac_add_4"
        traps:
          t1:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Dodałeś mianowniki! Zanim dodasz, musisz sprowadzić oba ułamki do wspolnego mianownika."
      - level: 5
        name: "Różne mianowniki - zaawansowane"
        function: "frac_add_5"
        traps:
          t1:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Zły wspólny mianownik! Znajdź najmniejszą wspólną wielokrotność obu liczb z dołu."
          t2:
            misconception: drops_whole_part
            explanation: "Zapomniałeś dodać całości! Zrobiłeś trudną część z ułamkami, ale zgubiłeś liczby z przodu."
          t3:
            misconception: leaves_improper_fraction_in_result
            explanation: "Nie wyciągnąłeś całości z wyniku! Na końcu powstał ułamek niewłaściwy."

  - id: 70
    name: "Odejmowanie"
    levels:
      - level: 1
        name: "Ten sam mianownik"
        function: "frac_sub_1"
        traps:
          t1:
            misconception: adds_instead_of_subtracting
            explanation: "Zamiast odjąć, dodałeś liczniki — sprawdź znak działania."
      - level: 2
        name: "Liczby mieszane"
        function: "frac_sub_2"
        traps:
          t1:
            misconception: drops_whole_part
            explanation: "Odjąłeś ułamki, ale zapomniałeś odjąć od siebie całości (duże liczby z przodu)!"
          t2:
            misconception: adds_instead_of_subtracting
            explanation: "Odjąłeś całości, ale dodałeś ułamki! Pamiętaj, tu mamy odejmowanie."
      - level: 3
        name: "Zabieranie całości"
        function: "frac_sub_3"
        traps:
          t1:
            misconception: subtracts_without_borrowing_from_whole
            explanation: "Odjąłeś ułamek od całości tak, jakby był całością! Musisz 'rozmienić' jedną całość na ułamek."
          t2:
            misconception: subtracts_without_borrowing_from_whole
            explanation: "Źle rozmieniłeś całość! 1 całość to ułamek, który ma na górze i na dole tę samą liczbę (np. 5/5)."
          t3:
            misconception: adds_instead_of_subtracting
            explanation: "Zamiast odjąć, dodałeś liczniki — sprawdź znak działania."
      - level: 4
        name: "Zabieranie całości w liczbie mieszanej"
        function: "frac_sub_4"
        traps:
          t1:
            misconception: borrows_incorrectly_in_mixed_subtraction
            explanation: "Zgubiłeś 'pożyczoną' całość! Kiedy rozmieniasz 1 całość na ułamek, musisz dodać go do tego ułamka, który już tam był."
          t2:
            misconception: borrows_incorrectly_in_mixed_subtraction
            explanation: "Zapomniałeś, że pożyczyłeś! Musisz zmniejszyć liczbę całości o 1."
          t3:
            misconception: borrows_incorrectly_in_mixed_subtraction
            explanation: "Odjąłeś ułamki w złą stronę (zamiast pożyczyć)! Nie wolno zamieniać kolejności odejmowania."
      - level: 5
        name: "Różne mianowniki"
        function: "frac_sub_5"
        traps:
          t1:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Odjąłeś mianowniki od siebie! Najpierw musisz znaleźć wspólny mianownik."
          t2:
            misconception: expands_only_one_part
            explanation: "Rozszerzyłeś dół, ale zapomniałeś o górze! Mnożymy proporcjonalnie."
          t3:
            misconception: operates_on_unlike_fractions_directly
            explanation: "Zły znak! Najpierw sprowadź do wspólnego mianownika."

  - id: 80
    name: "Mnożenie przez liczbę"
    levels:
      - level: 1
        name: "Mnożenie ułamka przez liczbę"
        function: "frac_mult_num_1"
        traps:
          t1:
            misconception: multiplies_fraction_by_whole_number_wrongly
            explanation: "Pomnożyłeś licznik ORAZ mianownik! Przy mnożeniu przez liczbę, mnożymy TYLKO licznik, mianownik zostaje."
          t2:
            misconception: multiplies_fraction_by_whole_number_wrongly
            explanation: "Pomnożyłeś tylko mianownik! Liczba całkowita mnoży tylko górę ułamka."
          t3:
            misconception: multiplies_fraction_by_whole_number_wrongly
            explanation: "Zamiast pomnożyć, dodałeś liczbę do licznika!"
      - level: 2
        name: "Skracanie na krzyż z liczbą"
        function: "frac_mult_num_2"
        traps:
          t1:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Wynik jest dobry, ale nieskrócony! Przed mnożeniem spróbuj skrócić liczbę całkowitą z mianownikiem."
          t2:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Skróciłeś ułamek przez złą liczbę!"
          t3:
            misconception: multiplies_fraction_by_whole_number_wrongly
            explanation: "Zamiast skrócić, pomnożyłeś liczbę przez mianownik! Pamiętaj, dół zawsze dzieli."
      - level: 3
        name: "Mnożenie liczby mieszanej"
        function: "frac_mult_num_3"
        traps:
          t1:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Pomnożyłeś całości, ale ułamek zostawiłeś! Liczba z przodu mnoży i całości, i ułamek."
          t2:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Najbezpieczniej jest zamienić liczbę mieszaną na ułamek niewłaściwy, a dopiero potem mnożyć!"
          t3:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Wciągnąłeś liczbę całkowitą na dół ułamka! Całości zostają u góry."

  - id: 90
    name: "Mnożenie ułamków"
    levels:
      - level: 1
        name: "Proste mnożenie"
        function: "frac_mult_1"
        traps:
          t1:
            misconception: misapplies_fraction_multiplication_rule
            explanation: "Pomnożyłeś na krzyż! Przy mnożeniu ułamków zasada to: 'Góra z górą, dół z dołem'."
          t2:
            misconception: misapplies_fraction_multiplication_rule
            explanation: "Zostawiłeś mianownik bez zmian! Tu się nie szuka wspólnego mianownika, tu się go mnoży!"
          t3:
            misconception: misapplies_fraction_multiplication_rule
            explanation: "Dodałeś zamiast pomnożyć!"
      - level: 2
        name: "Skracanie na krzyż"
        function: "frac_mult_2"
        traps:
          t1:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Pominąłeś skracanie! Szukaj pary na krzyż (jeden z góry, jeden z dołu) do podzielenia przez tę samą liczbę."
          t2:
            misconception: cancels_horizontally
            explanation: "Skróciłeś poziomo! Skracać wolno tylko górę z dołem (często na krzyż), nigdy dwa liczniki ze sobą."
          t3:
            misconception: inverts_fraction_unnecessarily
            explanation: "Podałeś ułamek odwrotny!"
      - level: 3
        name: "Mnożenie liczb mieszanych"
        function: "frac_mult_3"
        traps:
          t1:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Pomnożyłeś osobno całości i osobno ułamki! TO PUŁAPKA. Musisz najpierw zamienić wszystko na ułamki niewłaściwe."
          t2:
            misconception: leaves_improper_fraction_in_result
            explanation: "Zapomniałeś wyciągnąć całości z wyniku na samym końcu."
      - level: 4
        name: "Wielkie skracanie"
        function: "frac_mult_4"
        traps:
          t1:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Zapomniałeś skrócić! Przy dużych liczbach zawsze najpierw skracaj na krzyż, inaczej powstanie gigant."
          t2:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Skróciłeś źle! Pamiętaj, że obie liczby na krzyż musisz podzielić przez TO SAMO."

  - id: 100
    name: "Dzielenie przez liczbę"
    levels:
      - level: 1
        name: "Dzielenie licznika"
        function: "frac_div_num_1"
        traps:
          t1:
            misconception: divides_denominator_instead_of_numerator
            explanation: "Podzieliłeś mianownik! Gdy ułamek dzielimy przez liczbę całkowitą, to dzielimy tylko licznik (jeśli się da)."
          t2:
            misconception: divides_denominator_instead_of_numerator
            explanation: "Pomnożyłeś ułamek zamiast podzielić!"
      - level: 2
        name: "Gdy licznik się nie dzieli"
        function: "frac_div_num_2"
        traps:
          t1:
            misconception: divides_fractions_without_inverting_the_second
            explanation: "Odwróciłeś pierwszy ułamek! Pierwszy zostaje bez zmian, mnożymy zawsze przez odwrotność drugiego (czyli z liczby robimy '1/liczba')."
          t2:
            misconception: divides_denominator_instead_of_multiplying_it
            explanation: "Podzieliłeś mianownik! W tym przypadku musisz pomnożyć mianownik przez tę liczbę całkowitą."
      - level: 3
        name: "Dzielenie liczby mieszanej"
        function: "frac_div_num_3"
        traps:
          t1:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Podzieliłeś tylko ułamek, a zapomniałeś o całościach!"
          t2:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Musisz ZAWSZE najpierw zamienić liczbę mieszaną na ułamek niewłaściwy, a dopiero potem odwracać do mnożenia."

  - id: 110
    name: "Dzielenie ułamków"
    levels:
      - level: 1
        name: "Proste odwracanie"
        function: "frac_div_frac_1"
        traps:
          t1:
            misconception: divides_fractions_without_inverting_the_second
            explanation: "Zapomniałeś odwrócić! Dzielenie ułamków to to samo co MNOŻENIE pierwszego przez ODWROTNOŚĆ drugiego."
          t2:
            misconception: divides_fractions_without_inverting_the_second
            explanation: "Odwróciłeś PIERWSZY ułamek zamiast drugiego! Zawsze kręci się tylko drugi ułamek."
      - level: 2
        name: "Odwracanie i skracanie"
        function: "frac_div_frac_2"
        traps:
          t1:
            misconception: cancels_before_inverting
            explanation: "Skróciłeś PRZED odwróceniem! Kategoryczny błąd. Najpierw obróć drugi ułamek i zmień znak na mnożenie, dopiero potem wolno skracać."
          t2:
            misconception: does_not_reduce_to_lowest_terms
            explanation: "Zapomniałeś skrócić! Po odwróceniu szukaj wspólnych dzielników na krzyż."
      - level: 3
        name: "Dzielenie z liczbami mieszanymi"
        function: "frac_div_frac_3"
        traps:
          t1:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Najpierw bezwzględnie zamień wszystkie liczby na ułamki niewłaściwe. Dopiero potem obróć drugi ułamek!"
          t2:
            misconception: operates_on_mixed_number_without_converting
            explanation: "Odwróciłeś tylko część ułamkową liczby mieszanej! Musisz wciągnąć całości do ułamka zanim go odwrócisz."

  - id: 120
    name: "Potęgowanie"
    levels:
      - level: 1
        name: "Kwadrat ułamka"
        function: "frac_pow_1"
        traps:
          t1:
            misconception: multiplies_by_exponent_instead_of_powering
            explanation: "Potęgowanie to MNOŻENIE ułamka przez samego siebie, a nie mnożenie go przez 2!"
          t2:
            misconception: raises_only_one_part_to_power
            explanation: "Podniosłeś do kwadratu tylko górę! Musisz podnieść zarówno licznik, jak i mianownik."
      - level: 2
        name: "Sześcian ułamka"
        function: "frac_pow_2"
        traps:
          t1:
            misconception: raises_only_one_part_to_power
