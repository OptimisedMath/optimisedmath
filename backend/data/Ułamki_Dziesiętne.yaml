chapter: "Ułamki Dziesiętne"
id: 20
keyboard_type: "decimal"
topics:
  - id: 10
    name: "Zamiana ułamków"
    levels:
      - level: 1
        name: "Z ułamka dziesiętnego na zwykły"
        function: "dec_to_frac_1"
        traps:
          t1:
            misconception: misreads_decimal_place_value_as_denominator
            explanation: "Zły mianownik! Jedno miejsce po przecinku to 10 na dole. Dwa miejsca to 100, trzy to 1000. Policz zera!"
          t2:
            misconception: drops_whole_part
            explanation: "Zapomniałeś o całościach z przodu!"
          t3:
            misconception: misreads_decimal_place_value_as_denominator
            explanation: "Podałeś złą liczbę w liczniku. Wpisz dokładnie to samo co po przecinku."
      - level: 2
        name: "Ze zwykłego na dziesiętny (mianowniki 10, 100)"
        function: "dec_to_frac_2"
        traps:
          t1:
            misconception: misreads_denominator_zeros_as_decimal_places
            explanation: "Brakuje zera! Liczba zer w mianowniku to DOKŁADNIE liczba miejsc, które musisz zająć po przecinku."
          t2:
            misconception: misreads_denominator_zeros_as_decimal_places
            explanation: "Masz za dużo miejsc po przecinku. Spójrz na ilość zer na dole ułamka zwykłego."
          t3:
            misconception: misreads_denominator_zeros_as_decimal_places
            explanation: "Podałeś błędną cyfrę z licznika."
      - level: 3
        name: "Ze zwykłego na dziesiętny (rozszerzanie 2, 4, 5)"
        function: "dec_to_frac_3"
        traps:
          t1:
            misconception: converts_to_decimal_without_expanding_to_power_of_ten
            explanation: "Zanim zapiszesz przecinek, musisz rozszerzyć ułamek tak, aby na dole było 10, 100 lub 1000!"
          t2:
            misconception: expands_only_one_part
            explanation: "Zły wynik - zapomniałeś, by pomnożyć też górę!"
          t3:
            misconception: converts_to_decimal_without_expanding_to_power_of_ten
            explanation: "Zły wynik - ułamek rozszerza się przez odpowiednią liczbę."
      - level: 4
        name: "Ze zwykłego na dziesiętny (dzielenie)"
        function: "dec_to_frac_4"
        traps:
          t1:
            misconception: omits_repeating_decimal_notation
            explanation: "Zapomniałeś nawiasów okresu! Ułamek rozwijający się w nieskończoność zapisujemy z nawiasem, np. 0,(3)."
          t2:
            misconception: omits_repeating_decimal_notation
            explanation: "Dodałeś zbędne zero przed okresem lub źle umieściłeś nawias."
          t3:
            # Wrong: no walkthrough could address this — a calculation slip, not a Misconception.
            explanation: "Zła cyfra w okresie — sprawdź wynik dzielenia licznika przez mianownik."

  - id: 20
    name: "Porównywanie"
    radio_only: true
    levels:
      - level: 1
        name: "Różne cyfry, te same pozycje"
        function: "dec_compare_1"
        traps:
          t1:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Porównaj cyfry po przecinku od lewej strony."
          t2:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Liczby nie są równe — nie wybieraj znaku równości!"
      - level: 2
        name: "Różna liczba miejsc po przecinku"
        function: "dec_compare_2"
        traps:
          t1:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Porównaj cyfry po przecinku od lewej strony."
          t2:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Liczby nie są równe — nie wybieraj znaku równości!"
          t3:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Gdy liczby są równe, nie wybieraj '<' ani '>'!"
      - level: 3
        name: "Zdradliwe zera"
        function: "dec_compare_3"
        traps:
          t1:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Porównaj cyfry po przecinku od lewej strony."
          t2:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Liczby nie są równe — nie wybieraj znaku równości!"
          t3:
            misconception: compares_decimals_by_wrong_digit_order
            explanation: "Gdy liczby są równe, nie wybieraj '<' ani '>'!"
      - level: 4
        name: "Rozwinięcie nieskończone"
        function: "dec_compare_4"
        traps:
          t1:
            misconception: compares_repeating_decimals_incorrectly
            explanation: "Porównaj cyfry po przecinku od lewej strony."
          t2:
            misconception: compares_repeating_decimals_incorrectly
            explanation: "Liczby nie są równe — nie wybieraj znaku równości!"
          t3:
            misconception: compares_repeating_decimals_incorrectly
            explanation: "Gdy okresy są różne, liczby nie są równe — nie wybieraj znaku równości!"

  - id: 30
    name: "Oś liczbowa"
    levels:
      - level: 1
        name: "Oś co 0.1"
        function: "dec_number_line_1"
        traps:
          t1:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Pomyłka! Zobacz na przedział i policz wszystkie przerwy. Każdy skok to jedna dziesiąta (0.1)."
          t2:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Jesteś o jeden skok za daleko lub za blisko — policz przerwy od zera, nie kreski."
      - level: 2
        name: "Oś co 0.01"
        function: "dec_number_line_2"
        traps:
          t1:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Pomyłka! Jesteś między 0.1 a 0.2. Każdy mały skok to jedna setna (0.01)."
          t2:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Wielkość skoku masz dobrą — pomyliłeś się o jedną przerwę."
      - level: 3
        name: "Oś co 0.2 lub podobne"
        function: "dec_number_line_3"
        traps:
          t1:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Uwaga! Odstępy na osi nie zawsze wynoszą 1. Zobacz ile kresek dzieli pełną jedność, by odkryć wielkość jednego małego skoku."
          t2:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Wielkość skoku masz dobrą — pomyliłeś się o jedną przerwę."
      - level: 4
        name: "Duży odstęp"
        function: "dec_number_line_4"
        traps:
          t1:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Oblicz szerokość przedziału (np. 1.0 - 0.5) i podziel przez liczbę skoków (odstępów)."
          t2:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Błąd w liczeniu skoków — o jeden przedział za mało lub za dużo."
      - level: 5
        name: "Duży odstęp cz. 2"
        function: "dec_number_line_5"
        traps:
          t1:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Najpierw policz odstępy, później odejmij skrajne wartości, na końcu podziel."
          t2:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Skok policzyłeś dobrze, ale jesteś o jedną przerwę za daleko."
      - level: 6
        name: "Dziwne przedziały"
        function: "dec_number_line_6"
        traps:
          t1:
            misconception: counts_ticks_instead_of_gaps
            explanation: "Jesteś o jeden skok obok — policz przerwy jeszcze raz, nie kreski."
          t2:
            misconception: assumes_the_tick_value_without_deriving_it
            explanation: "Zgadłeś bez obliczenia wartości jednego skoku."

  - id: 40
    name: "Zaokrąglanie"
    levels:
      - level: 1
        name: "Do całości"
        function: "dec_round_1"
        traps:
          t1:
            misconception: rounds_using_the_wrong_digit
            explanation: "Zapomniałeś o regule '5 i więcej'! Spójrz na cyfrę po przecinku. Jeśli to 5, 6, 7, 8 lub 9, musisz powiększyć całość o jeden w górę."
          t2:
            misconception: rounds_using_the_wrong_digit
            explanation: "Pomyłka! Jeśli cyfra to 4, 3, 2, 1, 0 - nic nie powiększamy, po prostu ucina się to, co jest za nią."
      - level: 2
        name: "Do części dziesiątych"
        function: "dec_round_2"
        traps:
          t1:
            misconception: rounds_using_the_wrong_digit
            explanation: "Masz zaokrąglić do części dziesiątych (jedno miejsce po przecinku)! Zatem patrzysz TYLKO na drugą cyfrę po przecinku, by zdecydować co zrobić z pierwszą."
          t2:
            misconception: rounds_using_the_wrong_digit
            explanation: "Skreśliłeś źle. Zostaw tylko jedną cyfrę po przecinku."
      - level: 3
        name: "Zdradliwa dziewiątka"
        function: "dec_round_3"
        traps:
          t1:
            misconception: rounds_nine_without_carrying
            explanation: "Uwaga! Gdy zaokrąglasz 9 w górę, staje się ona dziesiątką, co oznacza, że musisz przepchnąć 'jeden' do jeszcze wyższego rzędu (efekt domina)."
          t2:
            misconception: rounds_nine_without_carrying
            explanation: "Zostawiłeś ,9 zamiast przejść do następnej całości z ,0."

  - id: 50
    name: "Dodawanie"
    levels:
      - level: 1
        name: "Bez przekroczenia rzędu"
        function: "dec_add_1"
        traps:
          t1:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Źle podstawiłeś przecinek w pamięci! Złota zasada dodawania to: Przecinek pod przecinkiem."
      - level: 2
        name: "Z przekroczeniem rzędu"
        function: "dec_add_2"
        traps:
          t1:
            misconception: forgets_to_carry
            explanation: "Zapomniałeś przenieść '1' do wyższego rzędu!"
          t2:
            misconception: forgets_to_carry
            explanation: "Zamiast przenieść '1', dopisałeś cały wynik po przecinku. Pamiętaj o przenoszeniu w pamięci!"
          t3:
            misconception: applies_multiplication_decimal_rule_to_addition
            explanation: "Zastosowałeś zasadę z mnożenia! Przy dodawaniu przecinek opada w dół, nie sumujemy miejsc po przecinku."
      - level: 3
        name: "Różna liczba miejsc (np. 1.2 + 0.05)"
        function: "dec_add_3"
        traps:
          t1:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Błąd dodawania różnej długości liczb! Zanim dodasz, wyrównaj je. Dopisz '0' na końcu krótszej liczby (np. zrób z 1.2 -> 1.20)."
          t2:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Przecinek jest ułożony źle. W działaniach pisemnych przecinek absolutnie musi stać nad przecinkiem."
          t3:
            # Wrong: no walkthrough could address this — a calculation slip, not a Misconception.
            explanation: "Błąd sumowania."

  - id: 60
    name: "Odejmowanie"
    levels:
      - level: 1
        name: "Bez pożyczania"
        function: "dec_sub_1"
        traps:
          t1:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Przecinek uciekł w złe miejsce! W odejmowaniu pisemnym zasada to przecinek idealnie pod przecinkiem."
      - level: 2
        name: "Z pożyczaniem"
        function: "dec_sub_2"
        traps:
          t1:
            misconception: forgets_to_borrow
            explanation: "Zapomniałeś o pożyczaniu z sąsiedniego rzędu!"
          t2:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Błędnie przepisałeś przecinek. Przecinek opada równo na dół."
      - level: 3
        name: "Z dopisywaniem zer (np. 1 - 0.25)"
        function: "dec_sub_3"
        traps:
          t1:
            misconception: does_not_align_decimals_before_column_arithmetic
            explanation: "Nie masz od czego odjąć liczby! Najpierw dopisz pożyczkowe zera na górze (zrób z 1 -> 1.00) i dopiero wtedy pożyczaj."
          t2:
            misconception: borrows_across_zero_incorrectly
            explanation: "Błąd w rzędzie dziesiątek - gdy pożyczasz nad zerem, to zero staje się 9."
          t3:
            misconception: forgets_to_borrow
            explanation: "Błąd pożyczania."

  - id: 70
    name: "Przesuwanie przecinka"
    levels:
      - level: 1
        name: "Mnożenie przez 10, 100..."
        function: "dec_comma_1"
        traps:
          t1:
            misconception: shifts_decimal_point_incorrectly
            explanation: "Przesunąłeś przecinek w lewą stronę! Mnożenie robi liczbę WIEKSZĄ, więc przecinek maszeruje w PRAWO."
          t2:
            misconception: shifts_decimal_point_incorrectly
            explanation: "Przesunąłeś o złą liczbę miejsc. Mnożąc przez 100 masz dwa zera, więc dwa skoki."
          t3:
            # Wrong: no walkthrough could address this — a calculation slip, not a Misconception.
            explanation: "Brak wykreślenia jedynek. Ułamek jest przesunięty, ale format dziwny."
      - level: 2
        name: "Dzielenie przez 10, 100..."
        function: "dec_comma_2"
        traps:
          t1:
            misconception: shifts_decimal_point_incorrectly
            explanation: "Przesunąłeś przecinek w prawą stronę! Dzielenie robi liczbę MNIEJSZĄ, więc przecinek ucieka w LEWO."
          t2:
            misconception: shifts_decimal_point_incorrectly
            explanation: "Przesunąłeś o złą liczbę miejsc. Dzieląc przez 100 masz dwa zera, więc robisz dwa skoki w lewo."
          t3:
            misconception: omits_leading_zero
            explanation: "Brakuje zera z przodu po przecinku."

  - id: 80
    name: "Mnożenie"
    levels:
      - level: 1
        name: "Przez liczbę jednocyfrową"
        function: "dec_mult_1"
        traps:
          t1:
            misconception: misplaces_decimal_point_in_product
            explanation: "Źle wstawiony przecinek w wyniku! Wymnóż liczby jakby przecinka nie było, a potem wstaw go tak, by po przecinku było tyle samo miejsc co w pytaniu."
          t2:
            # Wrong: no walkthrough could address this — a calculation slip, not a Misconception.
            explanation: "Zły wynik mnożenia."
      - level: 2
        name: "Ułamek przez ułamek"
        function: "dec_mult_2"
        traps:
          t1:
            misconception: misplaces_decimal_point_in_product
            explanation: "Pomyłka z przecinkiem! Policz wszystkie miejsca po przecinku w OBU mnożonych liczbach. Twój wynik musi mieć ich sumę!"
          t2:
            # Wrong: no walkthrough could address this — a calculation slip, not a Misconception.
            explanation: "Błąd w obliczeniach."
          t3:
            misconception: misplaces_decimal_point_in_product
            explanation: "Za mało miejsc po przecinku w wyniku."
      - level: 3
        name: "Z dużą ilością zer"
        function: "dec_mult_3"
        traps:
          t1:
            misconception: misplaces_decimal_point_in_product
            explanation: "Brak przecinka lub w złym miejscu! Pamiętaj, jeśli z przodu wychodzą zera, też je liczysz przy przesuwaniu."
          t2:
            misconception: misplaces_decimal_point_in_product
            explanation: "Zgubiłeś zera po przecinku przed samą liczbą."

  - id: 90
    name: "Dzielenie"
    levels:
      - level: 1
        name: "Przez liczbę całkowitą (bez reszty)"
        function: "dec_div_1"
        traps:
          t1:
            misconception: misplaces_decimal_point_in_quotient
            explanation: "Zgubiłeś przecinek! Podczas dzielenia pisemnego, wstawiasz przecinek w wyniku DOKŁADNIE w tym samym miejscu, co w dolnej liczbie."
          t2:
            misconception: misplaces_decimal_point_in_quotient
            explanation: "Błędnie przesunąłeś przecinek w wyniku — policz miejsca po przecinku w dzielnej."
      - level: 2
        name: "Przez liczbę całkowitą (z resztą)"
        function: "dec_div_2"
        traps:
          t1:
            misconception: stops_division_at_remainder
            explanation: "Wynik wyszedł z resztą! Pamiętaj, że w ułamkach dziesiętnych zawsze możesz dopisać darmowe '0' na samym końcu i ciągnąć dzielenie dalej."
          t2:
            misconception: omits_leading_zero
            explanation: "Brakuje zera w wyniku przed cyframi!"
          t3:
            misconception: misplaces_decimal_point_in_quotient
            explanation: "Przecinek w złym miejscu."
      - level: 3
        name: "Przez ułamek dziesiętny (proste)"
        function: "dec_div_3"
        traps:
          t1:
            misconception: divides_by_decimal_without_clearing_the_divisor
            explanation: "Nie wolno dzielić przez ułamek! Najpierw pozbądź się przecinka z dzielnika, przesuwając go w prawo w OBU liczbach, np. 2,4 : 0,2 = 24 : 2"
          t2:
            # Wrong: no walkthrough could address this — a calculation slip, not a Misconception.
            explanation: "Błąd mnożenia licznika i dzielnika po przesunięciu przecinka."
      - level: 4
        name: "Przez ułamek dziesiętny (zaawansowane)"
        function: "dec_div_4"
        traps:
          t1:
            misconception: divides_by_decimal_without_clearing_the_divisor
            explanation: "Przesunąłeś przecinek tylko w jednej liczbie. Pamiętaj, jeśli dzielnik przesuwasz o 2 w prawo, pierwszą liczbę (dzielną) TEŻ musisz przesunąć o 2."
          t2:
            misconception: stops_division_at_remainder
            explanation: "Nie masz już gdzie przesunąć? Zamiast kroku dodawaj na końcu zera (np. z 5 robisz 50)."

  - id: 100
    name: "Potęgowanie"
    levels:
      - level: 1
        name: "Kwadrat ułamka dziesiętnego"
        function: "dec_pow_1"
        traps:
          t1:
            misconception: multiplies_by_exponent_instead_of_powering
            explanation: "Mnożysz to przez 2, a to jest kwadrat (do potęgi drugiej). Mnożymy liczbę przez SAMĄ SIEBIE (np. 0.3 * 0.3)."
          t2:
            misconception: misplaces_decimal_point_in_product
            explanation: "Błąd w stawianiu przecinka. 0.3 ma 1 miejsce. 0.3 * 0.3 musi mieć 1+1=2 miejsca po przecinku (czyli np. 0.09)."
          t3:
            misconception: omits_leading_zero
            explanation: "Zapomniałeś zera z przodu (np. 0.04 to nie to samo co 0.4)."

  - id: 110
    name: "Kolejność wykonywania działań"
    levels:
      - level: 1
        name: "Kolejność Podstawowa"
        function: "dec_order_1"
        traps:
          t1:
            misconception: ignores_the_order_of_operations
            explanation: "Policzyłeś od lewej do prawej. Zawsze najpierw mnożenie i dzielenie!"
          t2:
            misconception: ignores_the_order_of_operations
            explanation: "Dodałeś lub odjąłeś wszystkie liczby, zapominając o mnożeniu."
          t3:
            misconception: ignores_the_order_of_operations
            explanation: "Ostatnie działanie wykonałeś przed pierwszym - zła kolejność!"
      - level: 2
        name: "Pojedyncze Nawiasy"
        function: "dec_order_2"
        traps:
          t1:
            misconception: ignores_the_order_of_operations
            explanation: "Zignorowałeś nawias! Wykonaj go w pierwszej kolejności."
          t2:
            misconception: uses_wrong_sign_after_brackets
            explanation: "Pomyliłeś znak na samym końcu działania."
          t3:
            misconception: ignores_the_order_of_operations
            explanation: "Policzyłeś od lewej do prawej ignorując nawias."
      - level: 3
        name: "Potęgi i Podstawy"
        function: "dec_order_3"
        traps:
          t1:
            misconception: ignores_the_order_of_operations
            explanation: "Zrobiłeś mnożenie przed potęgowaniem! Najpierw potęguj."
          t2:
            misconception: multiplies_by_exponent_instead_of_powering
            explanation: "Pomnożyłeś przez 2 zamiast podnieść do kwadratu!"
          t3:
            misconception: ignores_the_order_of_operations
            explanation: "Zignorowałeś potęgę i po prostu przepisałeś liczbę."
      - level: 4
        name: "Złożone Działania"
        function: "dec_order_4"
        traps:
          t1:
            misconception: ignores_the_order_of_operations
            explanation: "Rozwiązałeś nawiasy, ale policzyłeś resztę w złej kolejności."
          t2:
            misconception: ignores_the_order_of_operations
            explanation: "Zignorowałeś kolejność działań i połączyłeś liczby błędnie."
          t3:
            misconception: ignores_the_order_of_operations
            explanation: "Skupiłeś się na drugiej części i zapomniałeś o pierwszej."
      - level: 5
        name: "Potęgowanie Nawiasu"
        function: "dec_order_5"
        traps:
          t1:
            misconception: distributes_power_over_bracket_terms
            explanation: "Podniosłeś do kwadratu obie liczby osobno! Najpierw środek, potem potęga."
          t2:
            misconception: multiplies_by_exponent_instead_of_powering
            explanation: "Pomnożyłeś wynik nawiasu przez 2 zamiast potęgować."
